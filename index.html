<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ngemeja</title>
<meta name="description" content="Ruang kerja yang enak dilihat dan nyaman dipakai, dengan budget masuk akal. Semua barang yang muncul di konten ngemeja.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Layout: satu kolom ala link-in-bio (maks 560px), daftar barang dikelompokkan per postingan, tab kategori di atas */
:root{
  --bg:#F4EDE3; --surface:#FBF7F1; --tile:#EAE0D2; --line:#E0D2C0;
  --ink:#2A201B; --muted:#6B5A4E; --glow:#E3A06F; --btn:#2A201B; --btn-ink:#F4EDE3;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1714; --surface:#27201B; --tile:#332A23; --line:#3E342C;
    --ink:#F1E8DC; --muted:#BFAE9E; --glow:#E9AE80; --btn:#F1E8DC; --btn-ink:#1D1714; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1714; --surface:#27201B; --tile:#332A23; --line:#3E342C;
  --ink:#F1E8DC; --muted:#BFAE9E; --glow:#E9AE80; --btn:#F1E8DC; --btn-ink:#1D1714; color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:560px;margin:0 auto;padding-block:40px 56px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.mark{width:84px;height:84px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.desk{fill:var(--ink)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;letter-spacing:-0.01em;text-wrap:balance}
h1 em{font-style:italic}
.tag{margin:0;color:var(--muted);max-width:40ch}
.socials{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.socials a{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;min-height:36px;display:inline-flex;align-items:center}
.socials a:hover{background:var(--surface)}
.controls{display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top, 0px);background:var(--bg);padding-block:10px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{font:600 13px var(--body);line-height:1.15;padding:4px 2px;color:var(--muted);background:transparent;border:0;border-radius:10px;min-height:44px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.search{position:relative}
.search label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search input{width:100%;font:15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;min-height:46px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);stroke:var(--muted)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.post{display:flex;flex-direction:column;gap:12px}
.post-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.post-head h2{margin:0;font-family:var(--display);font-weight:500;font-size:21px;line-height:1.25;text-wrap:balance;min-width:0}
.eyebrow{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px}
.thumb{width:76px;height:76px;border-radius:12px;background:var(--tile);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pin{position:absolute;left:6px;top:6px;font:600 11px var(--body);background:var(--bg);color:var(--ink);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.thumb .ph{font-family:var(--display);font-style:italic;font-size:22px;color:var(--muted)}
.info{display:flex;flex-direction:column;gap:4px;min-width:0}
.info .cat{font-size:12px;color:var(--muted)}
.info .name{margin:0;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.price{font-variant-numeric:tabular-nums;font-size:14px}
.shop{font:600 13px var(--body);color:var(--btn-ink);background:var(--btn);text-decoration:none;border-radius:999px;padding:0 16px;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.shop:hover{opacity:.88}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--display);font-weight:500;font-size:18px}
footer{color:var(--muted);font-size:12.5px;text-align:center;display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
footer p{margin:0}
@media (prefers-reduced-motion: no-preference){ .item{transition:transform .15s ease} .item:hover{transform:translateY(-1px)} }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="mark">
      <svg width="44" height="50" viewBox="0 0 74 84" role="img" aria-label="Logo ngemeja">
        <circle cx="56" cy="12" r="9" fill="var(--glow)"></circle>
        <g class="desk"><rect x="2" y="30" width="68" height="13" rx="6.5"></rect><rect x="6" y="36" width="12" height="46" rx="6"></rect><rect x="54" y="36" width="12" height="46" rx="6"></rect></g>
      </svg>
    </div>
    <h1>ngemeja</h1>
    <p class="tag">Ruang kerja yang enak dilihat &amp; nyaman dipakai, budget masuk akal. Semua barang yang muncul di konten ada di sini.</p>
    <nav class="socials" aria-label="Akun sosial">
      <a href="https://www.instagram.com/ngemeja/">Instagram</a>
      <a href="https://www.threads.net/@ngemeja">Threads</a>
    </nav>
  </header>

  <div class="controls">
    <div class="tabs" role="tablist" aria-label="Kategori">
      <button type="button" role="tab" id="tab-semua" data-cat="semua" aria-selected="true">Semua</button>
      <button type="button" role="tab" id="tab-rumah" data-cat="rumah" aria-selected="false">Di Rumah</button>
      <button type="button" role="tab" id="tab-kantor" data-cat="kantor" aria-selected="false">Di Kantor</button>
      <button type="button" role="tab" id="tab-kecil" data-cat="kecil" aria-selected="false">Upgrade Kecil</button>
    </div>
    <div class="search">
      <label for="q">Cari barang</label>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.5" y2="16.5"></line></svg>
      <input id="q" type="search" placeholder="Cari barang, mis. sunscreen" autocomplete="off">
    </div>
  </div>

  <main id="list" aria-live="polite"></main>

  <footer>
    <p>Harga bisa berubah sewaktu-waktu. Cek harga terbaru di Shopee.</p>
    <p>© 2026 ngemeja</p>
  </footer>
</div>

<script>
/* DATA — gabungan: post yang disetujui lewat server (/api/bot?a=landing, Vercel Blob) + post lama di tab "Landing" Google Sheet. */
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vStiFHaACl6HZ3nUtg_Wdk5TKT6sbtqmbcDt-r8OTyRCgU6tEyDcdg4n06GvDNqVrBm_WxzPYfkK6oj/pub?gid=1283706677&single=true&output=csv";
let POSTS = [];
let STATUS = "loading";
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c=='"'){ if (text[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if (c=='"') q=true;
    else if (c==','){ row.push(cell); cell=""; }
    else if (c=='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if (c!='\r') cell+=c;
  }
  if (cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function tglKey(s){ const m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/); if(!m) return "0"; const p=n=>String(n||0).padStart(2,"0"); return m[1]+p(m[2])+p(m[3])+p(m[4])+p(m[5]); }
function tglTampil(s){ const m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? (+m[3])+" "+BULAN[+m[2]-1]+" "+m[1] : ""; }

// kategori dari server/Sheet -> tab: meja-kantor = kantor, upgrade-kecil = kecil, sisanya (meja-kos, sudut-kerja, data lama) = rumah
function grupKategori(k){ k=String(k||"").toLowerCase(); return k.includes("kantor") ? "kantor" : k.includes("upgrade") || k.includes("kecil") ? "kecil" : "rumah"; }
function buildPosts(rows){
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  const idx=k=>head.indexOf(k);
  const map=new Map();
  rows.forEach(r=>{
    const g=k=>(r[idx(k)]||"").trim();
    const id=g("post_id"), pin=parseInt(g("pin"),10), link=g("link");
    if(!id || !link || isNaN(pin)) return;
    if(!map.has(id)) map.set(id,{id, judul:g("judul")||"Postingan", tanggal:g("tanggal"), kategori:grupKategori(g("kategori")), produk:new Map()});
    const p=map.get(id);
    if (tglKey(g("tanggal"))>tglKey(p.tanggal)) p.tanggal=g("tanggal");
    const harga=parseInt(g("harga").replace(/[^0-9]/g,""),10);
    p.produk.set(pin,{pin, jenis:g("jenis"), nama:g("nama")||"Produk", harga:isNaN(harga)?null:harga, link, img:g("img")});
  });
  return [...map.values()]
    .map(p=>({...p, tanggal:tglTampil(p.tanggal), _k:tglKey(p.tanggal), produk:[...p.produk.values()].sort((a,b)=>a.pin-b.pin)}))
    .sort((a,b)=>b._k.localeCompare(a._k));
}

const LABEL = {rumah:"Di Rumah", kantor:"Di Kantor", kecil:"Upgrade Kecil"};
const rupiah = n => "Rp" + Number(n).toLocaleString("id-ID");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cat = "semua";
try { const h = location.hash.slice(1); if (LABEL[h]) cat = h; } catch(e){}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.cat === cat ? "true" : "false"));
  const posts = POSTS
    .filter(p => cat === "semua" || p.kategori === cat)
    .map(p => ({...p, produk: p.produk.filter(x => !q || (x.nama + " " + x.jenis).toLowerCase().includes(q))}))
    .filter(p => p.produk.length);
  const el = document.getElementById("list");
  if (STATUS==="loading"){ el.innerHTML='<div class="empty"><span>Memuat daftar barang…</span></div>'; return; }
  if (STATUS==="error"){ el.innerHTML='<div class="empty"><strong>Daftar belum termuat</strong><span>Coba muat ulang halaman sebentar lagi.</span></div>'; return; }
  if (!posts.length){
    el.innerHTML = q
      ? '<div class="empty"><strong>Belum ketemu</strong><span>Coba kata lain, misalnya “lampu” atau “rak”.</span></div>'
      : '<div class="empty"><strong>Segera hadir</strong><span>Barang ' + esc(LABEL[cat] || "") + ' dari postingan berikutnya akan muncul di sini.</span></div>';
    return;
  }
  el.innerHTML = posts.map(p => `
    <section class="post" aria-labelledby="h-${esc(p.id)}">
      <div class="post-head">
        <h2 id="h-${esc(p.id)}">${esc(p.judul)}</h2>
        <span class="eyebrow">${esc(LABEL[p.kategori])} · ${esc(p.tanggal)}</span>
      </div>
      <div class="list">
        ${p.produk.map(x => `
        <article class="item">
          <div class="thumb">
            <span class="ph" aria-hidden="true">${esc(String(x.pin).padStart(2,"0"))}</span>
            ${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
            <span class="pin" aria-label="Nomor di foto">${esc(String(x.pin).padStart(2,"0"))}</span>
          </div>
          <div class="info">
            <span class="cat">${esc(x.jenis)}</span>
            <p class="name">${esc(x.nama)}</p>
            <div class="row">
              <span class="price">${x.harga ? "± "+rupiah(x.harga) : ""}</span>
              <a class="shop" href="${esc(x.link)}" target="_blank" rel="noopener">Lihat di Shopee
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
              </a>
            </div>
          </div>
        </article>`).join("")}
      </div>
    </section>`).join('<div style="height:18px"></div>');
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { cat = b.dataset.cat; render(); }));
document.getElementById("q").addEventListener("input", render);
render();
function dariServer(j){
  return (j.posts||[]).map(p=>({ id:p.id, judul:p.judul||"Postingan", kategori:grupKategori(p.kategori),
    tanggal:tglTampil(p.tanggal||""), _k:tglKey(p.tanggal||""),
    produk:(p.produk||[]).filter(x=>x.link).map(x=>({pin:Number(x.pin), jenis:x.jenis||"", nama:x.nama||"Produk", harga:x.harga||null, link:x.link, img:x.img||""})).sort((a,b)=>a.pin-b.pin) }))
    .filter(p=>p.produk.length).sort((a,b)=>b._k.localeCompare(a._k));
}
const dariCsv = () => fetch(CSV_URL).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); }).then(t=>buildPosts(parseCSV(t)));
Promise.all([
  fetch("/api/bot?a=landing").then(r=>r.ok?r.json():{posts:[]}).then(dariServer).catch(()=>[]),
  dariCsv().catch(()=>null)
]).then(([srv,csv])=>{
  if(!srv.length && csv===null) throw new Error("data");
  const ids=new Set(srv.map(p=>p.id));
  POSTS=[...srv, ...(csv||[]).filter(p=>!ids.has(p.id))].sort((a,b)=>b._k.localeCompare(a._k)); STATUS="ok"; render(); })
  .catch(()=>{ STATUS="error"; render(); });
</script>

</body>
</html>
